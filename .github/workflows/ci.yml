name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # WinUI 3 and the Windows performance APIs require a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PulseDesk.slnx

      - name: Build
        run: dotnet build PulseDesk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project src/PulseDesk.Tests --configuration Release --no-build
